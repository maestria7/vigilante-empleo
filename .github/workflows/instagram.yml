name: Instagram a Recursos
# Lo lanza Supabase (pg_cron → API de GitHub, `lanzar_vigilante`) cada hora.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 instagram.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
      - name: Guardar el registro
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          python3 guardar_estado.py
