name: Resumen diario
# El horario lo lanza Supabase (pg_cron → API de GitHub, `lanzar_vigilante`): el programador de GitHub no llegó a disparar nunca este repositorio.
# Horarios (UTC): ligeras 10 5-21 * * * · pesadas 40 5,8,11,14,17,20 * * * · resumen 30 7 * * * · altas y bajas 0 8 y 0 7 * * * (el script solo manda si son las 9-10 h en España).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 resumen.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
