name: Resumen diario
on:
  schedule:
    - cron: "30 7 * * *"   # ~8:30 (invierno) / 9:30 (verano) en España
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 resumen.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
