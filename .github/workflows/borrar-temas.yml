name: borrar temas
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in 3 7 8 12 4 6 13; do
            curl -s "https://api.telegram.org/bot$TOK/deleteForumTopic" -d chat_id="$GRUPO" -d message_thread_id=$t | cut -c1-120
          done
        env:
          TOK: ${{ secrets.TELEGRAM_TOKEN }}
          GRUPO: ${{ secrets.TELEGRAM_GRUPO_ID }}
