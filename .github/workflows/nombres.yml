name: nombres
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="https://api.telegram.org/bot$TOK"
          curl -s $A/setMyDescription --data-urlencode "description=🔔 MI ALERTA DOCENTE · Radar Docente by Maestría

Tu próxima plaza puede estar publicada hoy.

Elige tus etapas, áreas y comunidades y te aviso por privado, al momento, solo de las ofertas que te encajan. Gratis.

Pulsa «Iniciar» y empieza. 👇"
          echo; curl -s $A/setMyShortDescription --data-urlencode "short_description=Avisos personales de ofertas docentes de toda España, solo de tu especialidad. Gratis. 🔔"
        env:
          TOK: ${{ secrets.TELEGRAM_TOKEN }}
          GRUPO: ${{ secrets.TELEGRAM_GRUPO_ID }}
