name: Vigilar ofertas
on:
  schedule:
    - cron: "*/30 6-21 * * *"   # cada 30 min de ~7 a 23 h (hora de España)
  workflow_dispatch:
permissions:
  contents: write
concurrency: vigilante
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 vigilante.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar lo ya visto
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "actualizar vistos" && git push)
