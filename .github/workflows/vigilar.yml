name: Vigilar ofertas (ligeras)
on:
  schedule:
    - cron: "10 5-21 * * *"   # cada hora, de ~6 a ~23 h en España
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 vigilante.py ligeras
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
      - name: Guardar lo ya visto
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add vistos.json vistos_publico.json limites.json
          git diff --cached --quiet || (git commit -m "actualizar vistos" && git pull --rebase -q && git push)
