name: Comprobar enlaces
# Lo lanza Supabase (pg_cron → API de GitHub, `lanzar_vigilante`) una vez al día.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  enlaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 enlaces.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
      - name: Guardar el registro
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          python3 guardar_estado.py
