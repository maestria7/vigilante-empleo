name: Altas y bajas (9:00)
# El horario lo lanza Supabase (pg_cron → API de GitHub, `lanzar_vigilante`): el programador de GitHub no llegó a disparar nunca este repositorio.
# Horarios (UTC): ligeras 10 5-21 * * * · pesadas 40 5,8,11,14,17,20 * * * · resumen 30 7 * * * · altas y bajas 0 8 y 0 7 * * * (el script solo manda si son las 9-10 h en España).
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Mandar ya, sin esperar a las 9:00 (prueba)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 metricas.py
        env:
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
          VACANTES_ENTREGA_URL: ${{ secrets.VACANTES_ENTREGA_URL }}
          VACANTES_ENTREGA_SECRETO: ${{ secrets.VACANTES_ENTREGA_SECRETO }}
      - name: Guardar la foto del día
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          python3 guardar_estado.py
