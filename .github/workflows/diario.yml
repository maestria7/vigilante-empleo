name: Altas y bajas (9:00)
on:
  schedule:
    - cron: "0 8 * * *"   # 9:00 en invierno (CET)
    - cron: "0 7 * * *"   # 9:00 en verano (CEST); el script solo manda si en España son las 9-10 h, y una vez al día
  workflow_dispatch:
    inputs:
      forzar:
        description: "Mandar ya, sin esperar a las 9:00 (prueba)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 metricas.py
        env:
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
          VACANTES_ENTREGA_URL: ${{ secrets.VACANTES_ENTREGA_URL }}
          VACANTES_ENTREGA_SECRETO: ${{ secrets.VACANTES_ENTREGA_SECRETO }}
      - name: Guardar la foto del día
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          python3 guardar_estado.py
