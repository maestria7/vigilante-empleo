name: Vigilar ofertas (pesadas)
on:
  schedule:
    - cron: "40 5,8,11,14,17,20 * * *"   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 vigilante.py pesadas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
      - name: Guardar lo ya visto
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          python3 guardar_estado.py
